hydra:
  run:
    dir: ''
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=
    - hydra.mode=RUN
    task:
    - ++model_config.llm_name=TinyLlama-1.1B-Chat-v1.0
    - ++model_config.llm_path=/home/ashley-bravo/models/tinyllama
    - ++model_config.llm_dim=2048
    - ++model_config.encoder_name=whisper
    - ++model_config.encoder_projector_ds_rate=5
    - ++model_config.encoder_path=large-v3
    - ++model_config.encoder_dim=1280
    - ++model_config.encoder_projector=linear
    - ++dataset_config.dataset=speech_dataset
    - ++dataset_config.val_data_path=/home/ashley-bravo/SLAM-LLM/examples/asr_librispeech/data/Fairspeech2/fairspeech_test.jsonl
    - ++dataset_config.input_type=mel
    - ++dataset_config.mel_size=128
    - ++dataset_config.inference_mode=true
    - ++train_config.model_name=asr
    - ++train_config.freeze_encoder=true
    - ++train_config.freeze_llm=true
    - ++train_config.batching_strategy=custom
    - ++train_config.num_epochs=1
    - ++train_config.val_batch_size=32
    - ++train_config.num_workers_dataloader=2
    - ++train_config.output_dir=/home/ashley-bravo/EXPERIMENTATION/Top-K/TaskArithmetic/1st-Method/K
    - ++decode_log=/fair_test
    - ++ckpt_path=/model.pt
    - ++log_config.log_file=/merged.log
  job:
    name: inference_asr_batch
    chdir: null
    override_dirname: ++ckpt_path=/model.pt,++dataset_config.dataset=speech_dataset,++dataset_config.inference_mode=true,++dataset_config.input_type=mel,++dataset_config.mel_size=128,++dataset_config.val_data_path=/home/ashley-bravo/SLAM-LLM/examples/asr_librispeech/data/Fairspeech2/fairspeech_test.jsonl,++decode_log=/fair_test,++log_config.log_file=/merged.log,++model_config.encoder_dim=1280,++model_config.encoder_name=whisper,++model_config.encoder_path=large-v3,++model_config.encoder_projector=linear,++model_config.encoder_projector_ds_rate=5,++model_config.llm_dim=2048,++model_config.llm_name=TinyLlama-1.1B-Chat-v1.0,++model_config.llm_path=/home/ashley-bravo/models/tinyllama,++train_config.batching_strategy=custom,++train_config.freeze_encoder=true,++train_config.freeze_llm=true,++train_config.model_name=asr,++train_config.num_epochs=1,++train_config.num_workers_dataloader=2,++train_config.output_dir=/home/ashley-bravo/EXPERIMENTATION/Top-K/TaskArithmetic/1st-Method/K,++train_config.val_batch_size=32
    id: ???
    num: ???
    config_name: prompt.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/ashley-bravo/SLAM-LLM
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ashley-bravo/SLAM-LLM/examples/asr_librispeech/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ashley-bravo/SLAM-LLM
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
